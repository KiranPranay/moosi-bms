<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A gentle progress tracker for the Predictive BMS project." />
  <meta name="color-scheme" content="light" />
  <title>Predictive BMS Tracker 🌻</title>

  <!-- Inline SVG favicon: a small pink flower. No extra file needed. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cg%20fill='%23f2b32e'%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(0 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(30 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(90 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(120 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(150 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(180 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(210 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(240 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(270 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(300 16 16)'/%3E%3Cellipse cx='16' cy='7.4' rx='2.9' ry='6.2' transform='rotate(330 16 16)'/%3E%3C/g%3E%3Ccircle%20cx='16'%20cy='16'%20r='6.2'%20fill='%236b4423'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='3.1'%20fill='%238a5a2b'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose:  { 50: '#fff7f9', 100: '#ffeef3', 200: '#fdd9e4', 300: '#f9bcd0', 400: '#f19ab7', 500: '#e67d9f' },
            blush: '#fbe4ea',
            petal: '#f7d6e0',
            cream: '#fffaf7',
            mauve: { 400: '#b58aa5', 500: '#9b7090', 600: '#7f5a76' },
            sage:  { 200: '#dcefe4', 400: '#9ccbb0', 600: '#5f9c78' },
            ink:   { 700: '#4a3b46', 500: '#7a6a75', 400: '#a3939e' }
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'Cambria', 'Times New Roman', 'serif'],
            sans: ['Nunito', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Helvetica Neue', 'Arial', 'sans-serif']
          },
          boxShadow: {
            petal: '0 8px 30px rgba(230,125,159,0.08)',
            'petal-lg': '0 12px 40px rgba(230,125,159,0.14)'
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="min-h-screen bg-gradient-to-b from-cream to-rose-50 font-sans text-ink-700 antialiased">

  <!-- Soft blurred background blobs. Fixed + clipped so they never create scrollbars. -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-32 -left-32 w-[28rem] h-[28rem] rounded-full bg-rose-200 blur-3xl opacity-60"></div>
    <div class="absolute -bottom-40 -right-32 w-[32rem] h-[32rem] rounded-full bg-petal blur-3xl opacity-60"></div>
  </div>

  <!-- ── Sticky header ─────────────────────────────────────────────── -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-cream/80 border-b border-rose-200/60">
    <div class="max-w-6xl mx-auto px-6 pt-4 pb-3">
      <div class="flex items-center justify-between gap-4">
        <h2 class="font-display font-semibold text-2xl md:text-3xl text-mauve-600 leading-tight">
          Predictive BMS Tracker&nbsp;🌻
        </h2>
        <div class="text-right shrink-0">
          <span id="progress-percent" class="block font-sans font-bold text-lg md:text-xl text-mauve-500 tabular-nums">0%</span>
          <span id="progress-count" class="block text-xs md:text-sm text-ink-400 tabular-nums">0 / 0 tasks</span>
        </div>
      </div>

      <div
        id="progress-track"
        class="mt-3 h-2.5 w-full rounded-full bg-rose-100 overflow-hidden"
        role="progressbar"
        aria-label="Overall project progress"
        aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill"
             class="h-full rounded-full bg-gradient-to-r from-rose-300 via-rose-400 to-mauve-400"
             style="width: 0%"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- ── Hero ────────────────────────────────────────────────────── -->
    <section class="max-w-5xl mx-auto px-6 pt-16 pb-10 text-center">
      <p class="text-xs md:text-sm uppercase tracking-[0.28em] text-ink-400 font-semibold">Project Tracker</p>

      <h1 class="mt-5 font-display font-bold text-5xl md:text-6xl text-mauve-600 leading-tight">
        Predictive BMS Tracker&nbsp;🌻
      </h1>

      <p id="subheading" class="mt-6 max-w-2xl mx-auto font-sans font-normal italic text-lg md:text-xl text-ink-500 leading-relaxed">
        Take it one step at a time. No rush, no stress. Just tick them off when you're ready.
      </p>

      <p id="celebration" class="hidden mt-6 max-w-2xl mx-auto font-sans font-normal italic text-lg md:text-xl text-mauve-500 leading-relaxed">
        You did it. Every single step. I'm so proud of you. 🌻
      </p>
    </section>

    <!-- ── Phases ──────────────────────────────────────────────────── -->
    <div class="max-w-6xl mx-auto px-6 pb-24">
      <div id="library" class="mb-8"></div>
      <div id="phases" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
  </main>

  <!-- ── Detail panel (notes + documents) ──────────────────────────── -->
  <div id="panel" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div id="panel-backdrop" class="absolute inset-0 bg-mauve-600/25 backdrop-blur-sm"></div>

    <div id="panel-scroll" class="absolute inset-0 overflow-y-auto p-4 sm:p-6 md:p-10">
      <div id="panel-sheet"
           class="relative mx-auto w-full max-w-3xl rounded-3xl bg-cream border border-rose-200/70
                  shadow-[0_24px_70px_rgba(122,90,118,0.22)]">

        <div class="sticky top-0 z-10 rounded-t-3xl bg-cream/95 backdrop-blur-md border-b border-rose-200/60
                    px-6 md:px-10 pt-7 pb-5">
          <div class="flex items-start gap-4">
            <span id="panel-badge"
                  class="w-10 h-10 shrink-0 rounded-full bg-rose-100 text-mauve-600 font-semibold
                         flex items-center justify-center select-none" aria-hidden="true"></span>
            <div class="flex-1 min-w-0">
              <h2 id="panel-title" class="font-display font-semibold text-2xl md:text-3xl text-ink-700 leading-snug"></h2>
              <p id="panel-blurb" class="text-ink-400 text-sm mt-1"></p>
            </div>
            <button id="panel-close" type="button" aria-label="Close"
                    class="shrink-0 w-9 h-9 rounded-full text-ink-400 hover:text-mauve-600 hover:bg-rose-100
                           transition-colors duration-300 flex items-center justify-center
                           focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-300 focus-visible:ring-offset-2">
              <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M5 5l10 10M15 5L5 15" />
              </svg>
            </button>
          </div>
        </div>

        <div id="panel-body" class="px-6 md:px-10 py-8"></div>
      </div>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────── -->
  <footer class="text-center text-sm text-ink-400 py-10 px-6">
    <p>Made with 🌻</p>
    <p id="last-ticked" class="mt-2 hidden"></p>
    <p class="mt-3">
      <a href="./docs/reviews/first-review/Predictive_BMS_First_Review.pdf"
         class="text-xs text-ink-400/80 underline underline-offset-4 decoration-rose-200 hover:text-mauve-500 hover:decoration-rose-300 transition-colors duration-300 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-300 focus-visible:ring-offset-2">
        Review documents
      </a>
    </p>
    <p class="mt-3">
      <button id="reset-progress" type="button"
              class="text-xs text-ink-400/80 underline underline-offset-4 decoration-rose-200 hover:text-mauve-500 hover:decoration-rose-300 transition-colors duration-300 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-300 focus-visible:ring-offset-2">
        Reset my progress
      </button>
    </p>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
